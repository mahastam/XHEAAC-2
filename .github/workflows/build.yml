      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build libxaac encoder (arm64)
        run: |
          git clone --depth 1 https://github.com/ittiam-systems/libxaac.git /tmp/libxaac
          mkdir /tmp/libxaac/build
          cd /tmp/libxaac/build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          ENC=$(find . -type f -name xaacenc | head -1)
          echo "Encoder binary: $ENC"
          file "$ENC"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp "$ENC" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libxaacenc.so"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: xheaac-apk
          path: app/build/outputs/apk/debug/*.apk
