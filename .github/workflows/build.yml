name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "xheaac"
          include(":app")
          EOF_0
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          EOF_2
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.xheaac"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.xheaac"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_3
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          
<?xml version="1.0" encoding="utf-8"?>
<manifest
    xmlns:android="http://schemas.android.com/apk/res/android">
    <application
                  android:label="xHE-AAC Encoder"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
          EOF_4
          mkdir -p $(dirname app/src/main/java/com/example/xheaac/MainActivity.kt)
          cat > app/src/main/java/com/example/xheaac/MainActivity.kt <<'EOF_5'
          package com.example.xheaac

          import android.app.Activity
          import android.content.Intent
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Bundle
          import android.text.InputType
          import android.widget.*
          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private var picked: Uri? = null
              private var outFile: File? = null
              private var player: MediaPlayer? = null
              private lateinit var logView: TextView
              private lateinit var bitrate: EditText

              // آرگومان‌های انکودر libxaac؛ اگر خطا داد، اینجا را اصلاح کنید
              private fun encoderArgs(bin: String, wav: File, out: File, bps: Int) = listOf(
                  bin, "-ifile:${wav.absolutePath}", "-ofile:${out.absolutePath}",
                  "-codec:3", "-br:$bps", "-mp4:1"
              )

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 48, 32, 32) }
                  val pick = Button(this).apply { text = "انتخاب آهنگ" }
                  bitrate = EditText(this).apply {
                      hint = "بیت‌ریت (kbps) - حداقل 6"; setText("12")
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }
                  val enc = Button(this).apply { text = "فشرده‌سازی با xHE-AAC" }
                  val play = Button(this).apply { text = "پخش خروجی" }
                  logView = TextView(this)
                  root.addView(pick); root.addView(bitrate); root.addView(enc); root.addView(play)
                  root.addView(ScrollView(this).apply { addView(logView) })
                  setContentView(root)

                  pick.setOnClickListener {
                      startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*"
                      }, 1)
                  }
                  enc.setOnClickListener { encode() }
                  play.setOnClickListener {
                      val f = outFile
                      if (f == null || !f.exists()) { log("هنوز خروجی‌ای نیست"); return@setOnClickListener }
                      player?.release()
                      player = MediaPlayer().apply { setDataSource(f.absolutePath); prepare(); start() }
                  }
              }

              @Deprecated("Deprecated")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == 1 && res == RESULT_OK) { picked = data?.data; log("انتخاب شد: $picked") }
              }

              private fun log(s: String) = runOnUiThread { logView.append(s + "\n") }

              private fun encode() {
                  val uri = picked ?: run { log("اول آهنگ را انتخاب کنید"); return }
                  val kbps = bitrate.text.toString().toIntOrNull() ?: 12
                  if (kbps < 6) { log("بیت‌ریت باید حداقل 6 باشد"); return }
                  thread {
                      try {
                          val wav = File(cacheDir, "in.wav")
                          val out = File(getExternalFilesDir(null), "output.m4a").also { it.delete() }
                          log("در حال دیکود...")
                          decodeToWav(uri, wav)
                          val bin = applicationInfo.nativeLibraryDir + "/libxaacenc.so"
                          log("در حال انکود (${kbps} kbps)...")
                          val code = run(encoderArgs(bin, wav, out, kbps * 1000))
                          if (code != 0 || !out.exists()) {
                              log("خطا (کد $code). راهنمای انکودر:")
                              run(listOf(bin))
                          } else {
                              outFile = out
                              log("تمام شد: ${out.absolutePath}\nحجم: ${out.length() / 1024.0} KB")
                          }
                      } catch (e: Exception) { log("خطا: $e") }
                  }
              }

              private fun run(cmd: List
<String>): Int {
                  val p = ProcessBuilder(cmd).redirectErrorStream(true).start()
                  p.inputStream.bufferedReader().forEachLine { log(it) }
                  return p.waitFor()
              }

              private fun decodeToWav(uri: Uri, out: File) {
                  val ex = MediaExtractor().apply { setDataSource(this@MainActivity, uri, null) }
                  var idx = -1; var fmt: MediaFormat? = null
                  for (i in 0 until ex.trackCount) {
                      val f = ex.getTrackFormat(i)
                      if (f.getString(MediaFormat.KEY_MIME)!!.startsWith("audio/")) { idx = i; fmt = f; break }
                  }
                  require(idx >= 0 && fmt != null) { "ترک صوتی پیدا نشد" }
                  ex.selectTrack(idx)
                  val codec = MediaCodec.createDecoderByType(fmt.getString(MediaFormat.KEY_MIME)!!)
                  codec.configure(fmt, null, null, 0); codec.start()
                  var rate = fmt.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                  var ch = fmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                  val raf = RandomAccessFile(out, "rw"); raf.setLength(0); raf.write(ByteArray(44))
                  val info = MediaCodec.BufferInfo()
                  var inDone = false; var outDone = false; var total = 0L
                  while (!outDone) {
                      if (!inDone) {
                          val i = codec.dequeueInputBuffer(10000)
                          if (i >= 0) {
                              val buf = codec.getInputBuffer(i)!!
                              val n = ex.readSampleData(buf, 0)
                              if (n < 0) { codec.queueInputBuffer(i, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM); inDone = true }
                              else { codec.queueInputBuffer(i, 0, n, ex.sampleTime, 0); ex.advance() }
                          }
                      }
                      val o = codec.dequeueOutputBuffer(info, 10000)
                      if (o >= 0) {
                          val buf = codec.getOutputBuffer(o)!!
                          val arr = ByteArray(info.size)
                          buf.position(info.offset); buf.get(arr)
                          raf.write(arr); total += info.size
                          codec.releaseOutputBuffer(o, false)
                          if (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) outDone = true
                      } else if (o == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          val nf = codec.outputFormat
                          rate = nf.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                          ch = nf.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                      }
                  }
                  codec.stop(); codec.release(); ex.release()
                  val h = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN)
                  h.put("RIFF".toByteArray()).putInt((36 + total).toInt()).put("WAVEfmt ".toByteArray())
                  h.putInt(16).putShort(1).putShort(ch.toShort()).putInt(rate).putInt(rate * ch * 2)
                  h.putShort((ch * 2).toShort()).putShort(16).put("data".toByteArray()).putInt(total.toInt())
                  raf.seek(0); raf.write(h.array()); raf.close()
                  log("WAV: ${rate}Hz, ${ch}ch")
              }
          }
          EOF_5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build libxaac encoder (arm64)
        run: |
          git clone --depth 1 https://github.com/ittiam-systems/libxaac.git /tmp/libxaac
          mkdir /tmp/libxaac/build && cd /tmp/libxaac/build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          ENC=$(find . -type f -name xaacenc | head -1)
          echo "Encoder binary: $ENC"
          file "$ENC"
          mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          cp "$ENC" $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libxaacenc.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: xheaac-apk
          path: app/build/outputs/apk/debug/*.apk
